<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">ShipNotes architecture</title><desc id="d">The browser sends a public repo and two refs to Next.js routes on Vercel, which count requests in Upstash Redis, read commits and PRs from the GitHub API, and write cited notes with one OpenAI call.</desc><defs><marker id="a-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="a-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#ffffff" stroke="#e3e6ea"/><rect x="24" y="24" width="252" height="552" rx="14" fill="#eef4ff"/>
